s.<\u002Fp>\n      <div><span class=\"tag\">Implantação<\u002Fspan><span class=\"tag\">Plantas e cortes<\u002Fspan><span class=\"tag\">Fachadas<\u002Fspan><\u002Fdiv>\n      <a href=\"https://wa.me/5527997991343?text=Ol%C3%A1%2C%20vim%20pelo%20site%20da%20WBP.%20Preciso%20de%20projeto%20arquitet%C3%B4nico.\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:700;margin-top:auto\">Solicitar proposta →<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"card dark\" style=\"grid-column:span 6;display:flex;flex-direction:column;gap:16px\">\n      <h3 style=\"font-size:24px;color:#FFFFFF\">Regularização de obra<\u002Fh3>\n      <p style=\"margin:0\">Construção existente sem projeto aprovado ou executada fora do projeto. Levantamento, projeto as-built, ART e orientação sobre o caminho na prefeitura.<\u002Fp>\n      <div><span class=\"tag\">As-built<\u002Fspan><span class=\"tag\">ART<\u002Fspan><span class=\"tag\">Habite-se<\u002Fspan><\u002Fdiv>\n      <a href=\"https://wa.me/5527997991343?text=Ol%C3%A1%2C%20vim%20pelo%20site%20da%20WBP.%20Preciso%20de%20regulariza%C3%A7%C3%A3o%20de%20obra.\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:700;margin-top:auto;color:#FFFFFF\">Solicitar proposta →<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"grid-column:span 4;display:flex;flex-direction:column;gap:16px\">\n      <h3 style=\"font-size:24px\">Projeto elétrico<\u002Fh3>\n      <p class=\"muted\" style=\"margin:0\">Instalações de baixa tensão com dimensionamento seguro, quadros organizados e documentação para o eletricista executar.<\u002Fp>\n      <div><span class=\"tag\">NBR 5410<\u002Fspan><\u002Fdiv>\n      <a href=\"https://wa.me/5527997991343?text=Ol%C3%A1%2C%20vim%20pelo%20site%20da%20WBP.%20Preciso%20de%20projeto%20el%C3%A9trico.\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:700;margin-top:auto\">Solicitar proposta →<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"grid-column:span 4;display:flex;flex-direction:column;gap:16px\">\n      <h3 style=\"font-size:24px\">Projeto estrutural<\u002Fh3>\n      <p class=\"muted\" style=\"margin:0\">Cálculo e detalhamento em concreto armado: fundações, vigas, pilares, lajes e reforços.<\u002Fp>\n      <div><span class=\"tag\">NBR 6118<\u002Fspan><span class=\"tag\">Concreto armado<\u002Fspan><\u002Fdiv>\n      <a href=\"https://wa.me/5527997991343?text=Ol%C3%A1%2C%20vim%20pelo%20site%20da%20WBP.%20Preciso%20de%20projeto%20estrutural.\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:700;margin-top:auto\">Solicitar proposta →<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"grid-column:span 4;display:flex;flex-direction:column;gap:16px\">\n      <h3 style=\"font-size:24px\">Projeto hidrossanitário<\u002Fh3>\n      <p class=\"muted\" style=\"margin:0\">Água fria, água quente, esgoto e drenagem dimensionados para o uso real do edifício.<\u002Fp>\n      <div><span class=\"tag\">NBR 5626<\u002Fspan><span class=\"tag\">NBR 8160<\u002Fspan><span class=\"tag\">NBR 10844<\u002Fspan><\u002Fdiv>\n      <a href=\"https://wa.me/5527997991343?text=Ol%C3%A1%2C%20vim%20pelo%20site%20da%20WBP.%20Preciso%20de%20projeto%20hidrossanit%C3%A1rio.\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:700;margin-top:auto\">Solicitar proposta →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"processo\" class=\"wrap\" style=\"padding-top:64px\">\n  <div style=\"max-width:720px;margin-bottom:32px\">\n    <div class=\"kicker\" style=\"margin-bottom:12px\">Processo<\u002Fdiv>\n    <h2 style=\"font-size:clamp(32px,4vw,52px)\">Do primeiro contato à ART assinada.<\u002Fh2>\n    <p class=\"muted\" style=\"font-size:17px;margin:16px 0 0\">Sem etapa surpresa. Você sabe o que recebe, quando e como.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"steps\" style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px\">\n    <div class=\"step\"><div class=\"kicker\">Etapa 1<\u002Fdiv><h3 style=\"font-size:19px;margin:8px 0\">Contato e levan mpleta entregue junto.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Fazem regularização de obra?<\u002Fsummary>\n        <p>Sim, para construções existentes sem projeto aprovado ou executadas fora do projeto. As exigências variam por município, então confirmamos o caminho junto à prefeitura antes de iniciar.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Compatibilizam com o projeto arquitetônico?<\u002Fsummary>\n        <p>Sempre que possível, e é o que recomendamos. A compatibilização entre disciplinas evita retrabalho no canteiro.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Fazem projeto de SPDA?<\u002Fsummary>\n        <p>Não. O projeto elétrico que oferecemos não inclui SPDA.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Fazem cálculo de estruturas metálicas?<\u002Fsummary>\n        <p>Não. O projeto estrutural que oferecemos é em concreto armado.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Qual o prazo médio de entrega?<\u002Fsummary>\n        <p>Residenciais: 15 a 30 dias. Comerciais, industriais ou com múltiplas disciplinas: prazo definido na proposta técnica, conforme o escopo.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contato\" class=\"wrap\" style=\"padding-top:48px\">\n  <div class=\"card dark\" style=\"padding:56px;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between;align-items:center\">\n    <div style=\"max-width:560px\">\n      <div class=\"kicker\" style=\"color:#F4F5F7;margin-bottom:12px\">Contato<\u002Fdiv>\n      <h2 style=\"font-size:clamp(34px,4.6vw,56px);color:#FFFFFF\">Traga a planta. <span style=\"color:#F0284A\">Respondemos em um dia útil.<\u002Fspan><\u002Fh2>\n      <p style=\"margin:16px 0 0;font-size:17px\">Envie sua demanda pelo WhatsApp e receba uma análise inicial com proposta objetiva.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction
